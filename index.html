<link rel="stylesheet" href="assets/css/site.css">

<header class="site-header shopify-section-group-header-group">
  <a href="./" class="brand" aria-label="Island Haze home">ISLAND HAZE<small>MAURITIUS</small></a>
  <nav aria-label="Main navigation">
    <a href="./" aria-current="page">Try the Look</a>
    <a href="https://islandhaze.mu/men.html" target="_blank" rel="noopener noreferrer">Men</a>
    <a href="https://islandhaze.mu/women.html" target="_blank" rel="noopener noreferrer">Women</a>
    <a href="stores.html">Stores</a>
    <a href="about.html">About</a>
  </nav>
  <button id="open-bag" type="button" aria-label="Open styling bag">
    <svg width="22" height="24" viewBox="0 0 24 26" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M4 8h16l1 16H3L4 8zM8 8V6a4 4 0 0 1 8 0v2"/></svg>
    <span data-cart-count>0</span>

<main id="runway">

</main>

<footer class="site-footer">
  <span>Island Haze · Mauritius · since 2008</span>
  <span><a href="https://www.instagram.com/island.haze/" target="_blank" rel="noopener noreferrer">Instagram</a> · <a href="https://www.facebook.com/islandhaze.mu" target="_blank" rel="noopener noreferrer">Facebook</a> · <a href="https://islandhaze.mu/" target="_blank" rel="noopener noreferrer">Shop islandhaze.mu</a></span>
</footer>

<dialog id="bag-dialog" aria-labelledby="bag-title">
  <div class="bag-heading"><h2 id="bag-title">Your styling bag</h2><button id="close-bag" type="button" aria-label="Close styling bag">×</button></div>
  <p class="bag-note">A local outfit shortlist. No payment or order is collected here. Open a piece on islandhaze.mu to buy it.</p>
  <div id="bag-items"></div>
  <p id="bag-total"></p>
  <button id="export-bag" type="button">Download outfit shortlist</button>
</dialog>
<div id="bag-status" role="status" aria-live="polite"></div>
